name: Validate merged warehouse
on:
  pull_request:
  push:
    branches: [codex/merge-parts-multilocation]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check.cjs
      - run: npm test
